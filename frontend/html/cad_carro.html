<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/cad_style.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cad_carro.js"defer></script>
    <title>Cadastro de Veículos</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Menu</a>
            <a href="./cad_carro.html">Cadastro</a>
            <a href="./list.carro.html">Listagem</a>
        </nav>
    </header>
    <main>
        <article>
            <h1>Sistema de Cadastro de Veículos</h1>
        </article>
        <br>
        <form>
            <label for="codigo">Código do Veículo</label><br>
            <input type="text" id="codigo"><br><br>
            <label for="nome">Nome do Veículo</label><br>
            <input type="text" id="nome"><br><br>
            <label for="marca">Marca do Veículo</label><br>
            <input type="text" id="marca"><br><br>
            <label for="categoria">Categoria do Veículo</label><br>
            <select id="categoria">
                <option value="">selecione uma opção</option>
                <option value="popular">Popular</option>
                <option value="sedan">Sedan</option>
                <option value="luxo">Luxo</option>
            </select><br><br>
            <label for="ano">Ano do Veículo</label><br>
            <input type="text" id="ano"><br><br>
            <label for="preco_fabrica">Preço de Fábrica do Veículo</label><br>
            <input type="text" id="preco_fabrica"><br><br>
            <button id="btn_cadastrar">Cadastrar</button><br><br>
        </form>
        <div id="resposta"></div>
    </main>
</body>
</html>
